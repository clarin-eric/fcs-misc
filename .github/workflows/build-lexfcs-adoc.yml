name: build <lexfcs> adocs 

on:
  push:
    branches:
      - main
    paths:
      - 'lexfcs/**'
      - '.github/workflows/build-lexfcs-adoc.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: asciidoctor/docker-asciidoctor

    steps:
      - name: Install fonts
        run: |
          mkdir -p /usr/share/fonts/truetype/vlgothic
          curl -L -o /usr/share/fonts/truetype/vlgothic/VL-PGothic-Regular.ttf https://github.com/deepin-community/fonts-vlgothic/raw/refs/heads/master/VL-PGothic-Regular.ttf

      - uses: actions/checkout@v4

      - name: Build HTML
        run: asciidoctor -v -D docs -a data-uri --backend=html5 -o lexfcs.html lexfcs/index.adoc

      - name: Build PDF
        run: asciidoctor-pdf -v -r ./lexfcs/scripts/pdf-converter-custom-title-page-with-acknowledgment.rb --trace -D docs -o lexfcs.pdf lexfcs/index.adoc

      - name: Copy attachments
        run: cp -R lexfcs/attachments docs/

      - name: Store results
        uses: actions/upload-artifact@v4
        with:
          name: lexfcs-specs
          path: docs/*
